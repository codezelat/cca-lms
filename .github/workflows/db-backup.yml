name: Database Backup

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      triggered_by:
        description: "Who triggered the backup run"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Create database backup
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      R2_REGION: ${{ secrets.R2_REGION }}
      DB_BACKUP_BUCKET_NAME: ${{ secrets.DB_BACKUP_BUCKET_NAME }}
      DB_BACKUP_PREFIX: ${{ secrets.DB_BACKUP_PREFIX }}
      DB_BACKUP_RETENTION_DAYS: ${{ secrets.DB_BACKUP_RETENTION_DAYS }}
      BACKUP_APP_URL: ${{ secrets.BACKUP_APP_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      BACKUP_TRIGGERED_BY: ${{ inputs.triggered_by || github.event_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare backup workspace
        run: |
          rm -rf .artifacts/db-backup
          mkdir -p .artifacts/db-backup

      - name: Validate and normalize database URL
        run: |
          node <<'NODE'
          const fs = require("node:fs");

          const required = [
            "SUPABASE_DB_URL",
            "R2_ACCOUNT_ID",
            "R2_ACCESS_KEY_ID",
            "R2_SECRET_ACCESS_KEY",
          ];

          const missing = required.filter(
            (name) => !process.env[name] || !process.env[name].trim(),
          );

          if (missing.length > 0) {
            console.error(
              `Missing required workflow secret(s): ${missing.join(", ")}`,
            );
            process.exit(1);
          }

          if (
            !process.env.DB_BACKUP_BUCKET_NAME?.trim() &&
            !process.env.R2_BUCKET_NAME?.trim()
          ) {
            console.error(
              "Either DB_BACKUP_BUCKET_NAME or R2_BUCKET_NAME must be configured.",
            );
            process.exit(1);
          }

          let url;
          try {
            url = new URL(process.env.SUPABASE_DB_URL.trim());
          } catch (error) {
            console.error(
              "SUPABASE_DB_URL must be a valid PostgreSQL connection string.",
            );
            process.exit(1);
          }

          if (!["postgres:", "postgresql:"].includes(url.protocol)) {
            console.error(
              `SUPABASE_DB_URL must use postgres:// or postgresql://, received ${url.protocol}`,
            );
            process.exit(1);
          }

          url.username = decodeURIComponent(url.username || "");
          url.password = decodeURIComponent(url.password || "");

          if (!url.hostname) {
            console.error("SUPABASE_DB_URL must include a database host.");
            process.exit(1);
          }

          if (!url.pathname || url.pathname === "/") {
            console.error("SUPABASE_DB_URL must include a database name.");
            process.exit(1);
          }

          fs.appendFileSync(
            process.env.GITHUB_ENV,
            `SUPABASE_DB_URL_NORMALIZED=${url.toString()}\n`,
          );

          console.log(
            `Backup target validated for host ${url.hostname}, port ${url.port || "5432"}, database ${url.pathname.slice(1)}`,
          );

          if (
            !process.env.BACKUP_APP_URL?.trim() ||
            !process.env.CRON_SECRET?.trim()
          ) {
            console.log(
              "Workflow status callbacks are disabled. Set BACKUP_APP_URL and CRON_SECRET to record backup events in the app audit log.",
            );
          }
          NODE

      - name: Dump roles
        run: |
          docker run --rm \
            -v "$PWD/.artifacts/db-backup:/backup" \
            postgres:17 \
            pg_dumpall \
            --dbname="$SUPABASE_DB_URL_NORMALIZED" \
            --roles-only \
            --file=/backup/roles.sql

      - name: Dump schema
        run: |
          docker run --rm \
            -v "$PWD/.artifacts/db-backup:/backup" \
            postgres:17 \
            pg_dump \
            --dbname="$SUPABASE_DB_URL_NORMALIZED" \
            --schema-only \
            --schema=public \
            --file=/backup/schema.sql

      - name: Dump data
        run: |
          docker run --rm \
            -v "$PWD/.artifacts/db-backup:/backup" \
            postgres:17 \
            pg_dump \
            --dbname="$SUPABASE_DB_URL_NORMALIZED" \
            --data-only \
            --schema=public \
            --file=/backup/data.sql

      - name: Bundle and upload backup
        id: bundle
        run: npx tsx scripts/process-db-backup.ts .artifacts/db-backup

      - name: Upload workflow artifact metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-result
          path: .artifacts/db-backup/result.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Report success to app
        if: success() && env.BACKUP_APP_URL != '' && env.CRON_SECRET != ''
        continue-on-error: true
        run: |
          curl --fail-with-body \
            -X POST "$BACKUP_APP_URL/api/cron/db-backup" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            -d "{\"status\":\"success\",\"artifactKey\":\"${{ steps.bundle.outputs.artifact_key }}\",\"artifactSizeBytes\":${{ steps.bundle.outputs.artifact_size_bytes }},\"artifactChecksum\":\"${{ steps.bundle.outputs.artifact_checksum }}\",\"durationMs\":${{ steps.bundle.outputs.duration_ms }},\"cleanupDeletedCount\":${{ steps.bundle.outputs.cleanup_deleted_count }},\"triggeredBy\":\"${BACKUP_TRIGGERED_BY}\",\"workflowRunUrl\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\",\"workflowRunId\":\"${{ github.run_id }}\"}"

      - name: Report failure to app
        if: failure() && env.BACKUP_APP_URL != '' && env.CRON_SECRET != ''
        continue-on-error: true
        run: |
          curl --fail-with-body \
            -X POST "$BACKUP_APP_URL/api/cron/db-backup" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            -d "{\"status\":\"failure\",\"triggeredBy\":\"${BACKUP_TRIGGERED_BY}\",\"error\":\"Backup workflow failed before completion. Review the workflow logs.\",\"workflowRunUrl\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\",\"workflowRunId\":\"${{ github.run_id }}\"}"
